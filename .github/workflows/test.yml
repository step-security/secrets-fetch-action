name: Test

on: [push, pull_request]

jobs:
  service-token-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run test
        env:
          NODE_ENV: development
  service-account-token-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm run test
        env:
          NODE_ENV: development
          DOPPLER_PROJECT: secrets-fetch-action
          DOPPLER_CONFIG: test
